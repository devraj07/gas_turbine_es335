name: Deploy research website to GitHub Pages
on:
  push:
    branches: [main, master]
    paths: ['website/**', 'data/**', 'notebook/**', 'outputs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check source data and website
        run: |
          python3 website/scripts/validate.py
          node --check website/assets/js/app.js
          node --check website/assets/js/predict.js
          node website/scripts/check_interactions.cjs
          node website/scripts/check_predictor.cjs
          node website/scripts/check_prediction_form.cjs
      - name: Package website
        run: python3 website/scripts/package_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
