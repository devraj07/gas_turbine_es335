name: Deploy research website to GitHub Pages
on:
  push:
    branches: [main, master]
    paths: ['website/**', 'data/**', 'notebook/**', 'outputs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare website downloads
        run: |
          mkdir -p website/assets/notebooks
          cp notebook/*.ipynb website/assets/notebooks/
          test -f website/index.html
          test -f website/predict/index.html
          test -f website/.nojekyll
      - name: Check source data and website
        run: |
          python3 website/scripts/validate.py
          node --check website/assets/js/app.js
          node --check website/assets/js/predict.js
          node website/scripts/check_interactions.cjs
          node website/scripts/check_predictor.cjs
          node website/scripts/check_prediction_form.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
